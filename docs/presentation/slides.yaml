- id: solution
  time: 30
  kicker: "Решение"
  title: "ALT STORES: одна карточка — все магазины"
  roles:
    - ["П", "Покупатель", "Ищет, сравнивает магазины, бронирует, пишет в чат"]
    - ["М", "Магазин", "Загружает прайс как есть, ведёт остатки и склад"]
    - ["А", "Администратор", "Проверяет флаги, жалобы, фото, каналы"]
  caption: "Карточка i5-12400F: предложения магазинов, цена рынка, характеристики"
  notes: |
    Решение — веб-сервис ALT STORES. Магазин загружает прайс как есть — Excel, CSV, PDF или пост из Telegram, — а система превращает каждую строку в стандартную карточку товара. Покупатель видит одну карточку и предложения всех магазинов с адресами, рыночную цену и предупреждения о подозрительных предложениях. Магазин ведёт в системе остатки и брони, а администратор следит за качеством базы.

- id: architecture
  time: 20
  kicker: "Архитектура"
  title: "Клиент–сервер в контейнерах Docker"
  notes: |
    Архитектура — клиент–сервер. Браузер через Cloudflare и nginx обращается к двум контейнерам Docker: интерфейс на React и сервер на FastAPI. Данные — в SQLite, фото — в отдельной папке. Внешние источники: ИИ Gemini с запасным Groq, курс Центрального банка раз в день и публичные Telegram-каналы.

- id: pipeline
  time: 30
  kicker: "Конвейер импорта"
  title: "Прайс любого вида проходит пять слоёв"
  stages:
    - ["Файл", "Excel, CSV, PDF, пост Telegram"]
    - ["Код", "Чтение, очистка; цена, валюта, артикул, наличие"]
    - ["Кэш", "Строки, которые система уже знает"]
    - ["Правила", "Процессоры, память, накопители, видеокарты"]
    - ["ИИ", "Только непонятные строки: Gemini, запасной Groq"]
    - ["Anti-Fraud", "Правила кодом + подсказка ИИ"]
    - ["Предпросмотр", "Продавец проверяет и правит"]
    - ["Публикация", "Карточки, цены, история"]
  measure_title: "Реальный прайс Age, повторная загрузка"
  measure:
    - ["2 359", "строк товаров"]
    - ["2 226", "из кэша, 94 %"]
    - ["133", "правилами"]
    - ["0", "запросов к ИИ"]
    - ["15 с", "весь конвейер"]
  notes: |
    Главная часть системы — конвейер импорта. Код читает файл и сам берёт цену, валюту, артикул и наличие — эти поля ИИ никогда не видит. Дальше строка проверяется по кэшу и по правилам, и только непонятные строки уходят к ИИ. Затем Anti-Fraud, предпросмотр, где продавец всё проверяет, и публикация. Внизу — реальный замер: повторная загрузка прайса Age Computers, 2 359 строк, — 15 секунд и ни одного запроса к ИИ.

- id: standard
  time: 30
  kicker: "Стандартизация"
  title: "Хаос → порядок: строки сводятся в одну карточку"
  raw:
    - "Intel-Core i5 - 12400F, oem, LGA1700"
    - "проц i5 12400f box"
    - "процессор Core i5-12400F OEM"
    - "i5 12400f"
  card:
    cat: "Процессоры · Intel"
    name: "Intel Core i5-12400F"
    specs:
      - ["Линейка", "Core i5"]
      - ["Сокет", "LGA1700"]
      - ["Встроенная графика", "Нет*"]
      - ["Код МХИК", "08542001013000000"]
    foot: "Все магазины — на одной карточке"
  rules:
    - ["Ключ сведения", "не зависит от OEM/BOX, языка и порядка слов"]
    - ["Характеристики", "только из строки продавца или вывод правила"]
    - ["Код МХИК", "из справочника tasnif.soliq.uz, не от ИИ"]
  notes: |
    Так выглядит стандартизация. Слева — записи одного процессора из разных прайсов, справа — одна эталонная карточка. Ключ сведения не зависит от упаковки, языка и порядка слов. Характеристики берутся только из строки продавца или выводятся правилом — догадки ИИ не сохраняются. Код МХИК — из официального справочника, а не от ИИ. Поэтому поиск «12400f» теперь находит одну карточку со всеми магазинами, а не две, как было до исправления ключа.

- id: ai
  time: 25
  kicker: "Роль ИИ"
  title: "ИИ — один слой, а не всё решение"
  code_head: "Делает код"
  code:
    - "Цена, валюта, артикул, наличие"
    - "Код МХИК из справочника"
    - "Ключ сведения карточек"
    - "Правила Anti-Fraud"
  ai_head: "Делает ИИ"
  ai:
    - "Категория, бренд, модель — только для строк, которые не поняли правила"
    - "Подсказка Anti-Fraud (уровень «info»)"
  donut_title: "Кто разобрал 1 178 строк замера"
  learn_head: "Ответы ИИ запоминаются — система умнеет"
  learn_from: "100 мин"
  learn_from_text: "первая загрузка: пустой кэш, бесплатный уровень API"
  learn_to: "15 с"
  learn_to_text: "повторная загрузка: 94 % строк из кэша, 0 запросов к ИИ"
  notes: |
    Важное решение — разделить работу между кодом и ИИ. Всё, где ошибка дорого стоит, — цену, валюту, наличие, код МХИК — делает код. ИИ определяет только категорию, бренд и модель, и только для строк, которые не поняли правила: на замере это треть строк. Ответы ИИ запоминаются: первая загрузка большого прайса на бесплатном уровне API, которым пользовался прототип, шла сто минут, повторная — пятнадцать секунд.

- id: fraud
  time: 20
  kicker: "Anti-Fraud"
  title: "Подозрительные предложения видны сразу"
  caption: "Предпросмотр демо-прайса: плашки подозрений у строк"
  checks:
    - "Серверный процессор под видом игрового"
    - "DDR4 и DDR5 в одной строке"
    - "Нереальный объём за бесценок"
    - "Цена сильно ниже рынка"
  principles:
    - "Сначала правила кодом, ИИ — вторым слоем"
    - "Мягкие формулировки, продавец может оспорить"
  big: "22 из 22"
  big_text: "подвохов поймано на замере; 1 спорный флаг на 1 142 чистых строках"
  notes: |
    Anti-Fraud проверяет каждое предложение: серверный процессор под видом игрового, противоречие DDR4 и DDR5, нереальный объём за копейки, цену сильно ниже рынка. Сначала правила, ИИ — только подсказкой. Формулировки мягкие, продавец может оспорить флаг. На замере пойманы все 22 подвоха.

- id: monitoring
  time: 20
  kicker: "Мониторинг цен"
  title: "Рынок целиком: цена, история, индексы"
  caption: "«Цены на рынке»: индексы категорий"
  facts:
    - ["Рыночная цена", "медиана цен всех магазинов на карточку"]
    - ["История цен", "пишется при каждом изменении цены"]
    - ["Индексы категорий", "100 — начало периода; рост и падение цен"]
    - ["Курс ЦБ раз в день", "покупателю — сумы и доллары, «≈» — пересчёт"]
  notes: |
    Мониторинг строится на той же единой базе. Рыночная цена — это медиана цен всех магазинов на карточку. История цен пишется при каждом изменении, по категориям считаются индексы. Цена хранится в валюте продавца, а покупатель видит и сумы, и доллары по курсу Центрального банка.

- id: seller
  time: 25
  kicker: "Кабинет продавца"
  title: "Простой учёт вместо Excel"
  chips:
    - "Прайс из Excel"
    - "Остатки по филиалам"
    - "Склад: приёмка → выкладка → продажа → ревизия"
    - "Сканер: USB и камера"
    - "Брони"
    - "Чат по товару"
    - "Уведомления"
  formula: "Доступно = остаток − бронь"
  captions: ["Мои товары", "Склад: приёмка сканером", "С телефона"]
  notes: |
    Для продавца ALT STORES — ещё и простой учёт. Остатки по филиалам, склад: приёмка, выкладка, продажа и ревизия сканером штрихкодов — USB-сканером или камерой телефона. Доступный остаток — это остаток минус брони. Товар не нужно описывать: он уже стандартизирован, поэтому наличие на витрине честное.

- id: storefront
  time: 20
  kicker: "Витрина"
  title: "Покупатель находит и сравнивает за минуту"
  captions: ["Главная", "Карточка с телефона", "Б/у из Telegram", "Готовая сборка"]
  chips:
    - "Поиск и фильтры"
    - "Б/у из Telegram"
    - "Готовые сборки"
    - "RU · UZ · EN"
    - "Стандарт фото"
  notes: |
    Витрина для покупателя: поиск, карточка товара со всеми магазинами, раздел б/у с объявлениями из Telegram-каналов и готовые сборки, где каждая деталь — карточка из единой базы. Интерфейс на трёх языках, работает на телефоне. Для фото — единый стандарт и модерация.

- id: database
  time: 15
  kicker: "База данных"
  title: "Эталонный товар + предложения магазинов"
  note: "35 таблиц; показаны главные. SQLite через SQLAlchemy — переход на PostgreSQL сменой строки подключения"
  notes: |
    В центре базы — эталонный товар и предложения магазинов. У товара — категория с кодом МХИК, у предложения — цена, история цен и флаги Anti-Fraud. Рядом — учёт: филиалы, остатки, журнал движений и брони. Всего 35 таблиц.

- id: tech
  time: 20
  kicker: "Технологии"
  title: "Проверенный стек, ИИ через API"
  cols:
    - head: "Сервер"
      items: ["Python, FastAPI", "SQLAlchemy, SQLite", "markitdown — чтение файлов", "Pillow — фото"]
    - head: "Интерфейс"
      items: ["React, Vite", "Tailwind CSS", "react-i18next — 3 языка", "Адаптивно от 360 px"]
    - head: "Инфраструктура и ИИ"
      items: ["Docker Compose на VPS", "nginx, Cloudflare (HTTPS)", "Gemini, запасной Groq", "pytest, vitest"]
  bottom: "Прототип испытан на бесплатном уровне API. В эксплуатации подключается платный API (например, Gemini API) заменой ключа, без изменения архитектуры"
  notes: |
    Сервер — Python и FastAPI, интерфейс — React, база — SQLite, всё работает в Docker. Прототип испытывался на бесплатном уровне API Gemini с резервным Groq. В эксплуатации подключается платный API заменой ключа, без изменения архитектуры, — и первая загрузка большого прайса займёт минуты вместо десятков минут.

