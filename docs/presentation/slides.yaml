  title: "Проверка на шести уровнях"
  tiles:
    - ["572", "автотеста сервера (pytest)"]
    - ["161", "автотест интерфейса (vitest)"]
    - ["2 178", "ключей перевода × 3 языка"]
    - ["1 178", "строк в эксперименте точности"]
  examples_head: "Примеры проверок"
  examples:
