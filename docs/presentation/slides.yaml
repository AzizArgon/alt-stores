# ---------------------------------------------------------------- основные
- id: title
  time: 15
  label: "Выпускная квалификационная работа"
  tagline: "ALT STORES — единая база компьютерной техники Узбекистана"
  notes: |
    Здравствуйте, уважаемые члены комиссии. Тема моей выпускной работы — «Разработка информационной системы мониторинга и стандартизации рынка компьютерной техники». Система, которую я разработал, называется ALT STORES.

- id: problem
  time: 25
  kicker: "Проблема"
  title: "Один товар — десятки разных названий"
  rows_title: "Один и тот же процессор в разных источниках"
  rows:
    - ["Прайс Age Computers", "Intel-Core i5 - 12400F, 2.7 GHz, 18MB, oem, LGA1700"]
    - ["Прайс со сленгом", "проц i5 12400f box"]
    - ["Другой прайс", "процессор Core i5-12400F OEM"]
    - ["Пост в Telegram", "i5 12400f б/у"]
    - ["Пост о сборке", "Процессор: Intel Core i5-12400F"]
  rows_note: "Строки из прайсов и постов проекта, без цен"
  pains:
    - ["Разные форматы", "Excel, CSV, PDF, посты Telegram; сумы и доллары"]
    - ["Нельзя сравнить", "Покупатель не видит все цены на один товар"]
    - ["Рынок непрозрачен", "Нет рыночной цены, истории, индексов"]
    - ["Сомнительные предложения", "Серверный Xeon «как i9», флешка 2 ТБ за $9"]
  notes: |
    Компьютерную технику в Узбекистане продают в основном небольшие магазины. Каждый ведёт прайс по-своему: Excel, PDF, посты в Telegram со сленгом. На слайде — один и тот же процессор из пяти источников, и везде он записан по-разному. Поэтому покупатель не может честно сравнить цены, а общую картину рынка никто не видит.

