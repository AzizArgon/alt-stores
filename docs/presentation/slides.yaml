- id: results
  time: 35
  kicker: "Результаты"
  title: "Результаты в цифрах"
  chart_title: "Точность разбора по полям, %"
  series: ["Только правила", "Правила + Gemini"]
  cats: ["Категория", "Бренд", "Модель", "Нужная карточка", "Характеристики", "Цена и валюта"]
  rules: [69.5, 68.6, 63.4, 74.6, 71.7, 100]
  gemini: [99.1, 99.5, 97.2, 93.1, 94.5, 100]
  chart_note: "Набор с известными ответами: 1 178 строк"
  tiles:
    - ["2 из 3", "строк разобрано без ИИ"]
    - ["15 с", "вместо 100 мин"]
    - ["22 из 22", "подвоха поймано"]
    - ["236 → 16", "карточек в «Прочем»"]
    - ["2 448", "карточек в базе"]
    - ["49 из 50", "деталей сборок"]
  notes: |
    Точность я измерил на наборе из 1 178 строк с заранее известными ответами. Цена и валюта верны в ста процентах строк — их берёт код. С ИИ категория верна в 99 процентах, правильную карточку находят 93 процента строк, без ИИ — три четверти. Две трети строк разбираются вообще без ИИ. Anti-Fraud поймал все 22 подвоха, «Прочее» сократилось с 236 карточек до 16. Повторная загрузка реального прайса занимает 15 секунд, в постах о сборках найдено 49 деталей из 50. Сейчас в базе 2 448 карточек и 4 285 предложений из 11 источников.

