# nginx inside the web container: built frontend + /api to the backend container.
# The visitor's real IP is set by nginx of the host (from Cloudflare) in X-Real-IP and passed on unchanged;
# the container listens only on 127.0.0.1 of the host, so nobody else can send it.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    # Demo site: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Built files have a hash in the name, so they can be cached for long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # index.html is never cached, so a new version shows right after deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
