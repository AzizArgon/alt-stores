# Shared part of both pcmarket server blocks (installed to /etc/nginx/snippets/pcmarket-app.conf).
# The site runs in Docker (/opt/alt-stores, docker-compose.yml): everything goes to the web container on 127.0.0.1:8095,
# it serves the frontend and forwards /api to the backend container. noindex and caching are set there.
charset utf-8;
client_max_body_size 20m;

# The visitor's real IP comes from Cloudflare (https://www.cloudflare.com/ips/).
# Only trusted from Cloudflare addresses, so a direct request cannot fake it.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

access_log /var/log/nginx/pcmarket.log;

# Let's Encrypt checks the domain here (certbot, renewal of the certificate for port 2053)
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type "text/plain";
}

location / {
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}
